[package]
name = "cadenza"
version = "1.0.0"
description = "A Spotify client with its own sound engine"
license = "MIT"
repository = "https://github.com/Chedd4rr/Cadenza"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2"
regex = "1"
dirs = "5"
open = "5"
cpal = "0.15"
rustfft = "6"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
md-5 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }

# Development builds (./build.sh --run) keep debugging information only for Cadenza's own code, not for the
# hundreds of libraries it uses: that alone is most of the build folder's size (several GB otherwise).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# They still optimise Cadenza's own code and the audio libraries, so the sound plays smoothly. Everything
# else stays quick to compile.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.dev.package.cadenza]
opt-level = 2

[profile.dev.package.cpal]
opt-level = 2

[profile.dev.package.rustfft]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
strip = true
