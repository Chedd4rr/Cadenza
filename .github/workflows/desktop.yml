# Builds the Windows, Linux and macOS app (desktop/) on every push that touches it, so a change that
# breaks one of them shows up straight away. The installers are kept for a week under the run's
# "Artifacts", for trying out. Releases come later (phase 7 of the port).
name: Desktop app

on:
  push:
    paths: ["desktop/**", "Resources/web/**", "patches/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "Resources/web/**", "patches/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libasound2-dev libssl-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Cache the librespot build
        uses: actions/cache@v4
        with:
          path: ~/.cadenza-librespot
          key: librespot-${{ matrix.name }}-${{ hashFiles('desktop/librespot.sh', 'patches/*.patch') }}

      - name: Build librespot
        run: CADENZA_CACHE="$HOME/.cadenza-librespot" ./desktop/librespot.sh

      - name: Install Tauri's build tool
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the app
        working-directory: desktop
        run: cargo tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: cadenza-${{ matrix.name }}
          retention-days: 7
          path: |
            desktop/target/release/bundle/deb/*.deb
            desktop/target/release/bundle/appimage/*.AppImage
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/dmg/*.dmg
