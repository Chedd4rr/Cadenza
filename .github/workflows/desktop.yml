# Builds the Windows, Linux and macOS app (desktop/) when you ask for it: Actions → Desktop app →
# Run workflow, then pick which system. The installers are kept for a week under the run's "Artifacts".
#
# It only runs when started by hand because on a private repository build time comes out of a monthly
# allowance, and the Mac runners cost about ten times as much as Linux ones. Roughly, one run costs:
# Linux $0.12, Windows $0.30, macOS $1.55, of the $12 a month a free account includes. The first run on
# each system takes longer (everything, librespot included, is compiled from scratch, then kept in the cache).
name: Desktop app

on:
  workflow_dispatch:
    inputs:
      system:
        description: Which system to build
        type: choice
        default: linux
        options: [linux, windows, macos, all]

permissions:
  contents: read

jobs:
  # Turns the choice into the list of systems to build, so only those runners start (and are paid for).
  pick:
    runs-on: ubuntu-latest
    outputs:
      systems: ${{ steps.pick.outputs.systems }}
    steps:
      - id: pick
        run: |
          linux='{"os":"ubuntu-22.04","name":"linux","bundles":"deb,appimage"}'
          windows='{"os":"windows-latest","name":"windows","bundles":"nsis"}'
          macos='{"os":"macos-latest","name":"macos","bundles":"app,dmg"}'
          case "${{ inputs.system }}" in
            all) echo "systems=[$linux,$windows,$macos]" >> "$GITHUB_OUTPUT" ;;
            windows) echo "systems=[$windows]" >> "$GITHUB_OUTPUT" ;;
            macos) echo "systems=[$macos]" >> "$GITHUB_OUTPUT" ;;
            *) echo "systems=[$linux]" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: pick
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pick.outputs.systems) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - name: Linux libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libasound2-dev libssl-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # librespot's pinned source with Cadenza's patches, which the app compiles into itself.
      - name: Get librespot's source ready
        run: CADENZA_CACHE="$HOME/.cadenza-librespot" ./desktop/librespot.sh

      # The tests, on this system too (the Windows ones are the only way to run them there).
      - name: Tests
        working-directory: desktop
        run: cargo test

      # Tauri's build tool, as a ready-made download (compiling it from source took about 10 minutes).
      - uses: cargo-bins/cargo-binstall@main
      - name: Install Tauri's build tool
        run: cargo binstall tauri-cli --version "^2" --no-confirm

      # Only the installers worth handing out (on Windows that skips the .msi, which needs another tool).
      - name: Build the app
        working-directory: desktop
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v6
        with:
          name: cadenza-${{ matrix.name }}
          retention-days: 7
          path: |
            desktop/target/release/bundle/deb/*.deb
            desktop/target/release/bundle/appimage/*.AppImage
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/dmg/*.dmg
