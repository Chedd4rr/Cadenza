# Makes a release: builds the installers for Mac, Windows and Linux, signs the update files, and puts
# everything on a DRAFT GitHub release (nothing is public until you press Publish there).
# Run it from Actions → Release → Run workflow, after raising the version in desktop/tauri.conf.json and
# desktop/Cargo.toml (the same number in both) and pushing. First-time setup is in docs/releasing.md.
#
# One run costs about what Desktop app → all systems does (a few dollars of a private repository's monthly
# allowance, most of it the Mac runner).
# Every action below is pinned to an exact commit (the version is in the comment after it), so what runs
# can't change under you. Dependabot (.github/dependabot.yml) sends a pull request when a newer one is out.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write        # to make the draft release and upload to it

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - id: v
        run: |
          conf="$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' desktop/tauri.conf.json | head -1)"
          cargo="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' desktop/Cargo.toml | head -1)"
          if [ -z "$conf" ] || [ "$conf" != "$cargo" ]; then
            echo "The version in desktop/tauri.conf.json ($conf) and desktop/Cargo.toml ($cargo) don't match."; exit 1
          fi
          if ! grep -q '"pubkey": "[^"]' desktop/tauri.conf.json; then
            echo "No update key in desktop/tauri.conf.json (plugins → updater → pubkey). See docs/releasing.md."; exit 1
          fi
          if [ -z "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" ]; then
            echo "The TAURI_SIGNING_PRIVATE_KEY secret isn't set. See docs/releasing.md."; exit 1
          fi
          echo "version=$conf" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux,   bundles: "appimage" }
          - { os: windows-latest, name: windows, bundles: "nsis" }
          - { os: macos-latest, name: macos,   bundles: "app,dmg" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0

      - name: Linux libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libasound2-dev libssl-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca  # the "stable" branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: desktop

      - name: Get librespot's source ready
        run: CADENZA_CACHE="$HOME/.cadenza-librespot" ./desktop/librespot.sh

      - name: Tests
        working-directory: desktop
        run: cargo test

      - uses: cargo-bins/cargo-binstall@4b6fa09d0d1ef9740a0c332e31b9ae336f97efa0  # v1.28.0
      - name: Install Tauri's build tool
        run: cargo binstall tauri-cli --version "^2" --no-confirm

      # Builds, signs the update files with the private key, and adds this system's installers and its entry
      # in latest.json (the file Cadenza's update check reads) to the draft release.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5  # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: cargo tauri
          tagName: v${{ needs.check.outputs.version }}
          releaseName: Cadenza ${{ needs.check.outputs.version }}
          releaseBody: See the assets below to download. Mac, Windows and Linux builds aren't signed with a paid certificate, so the first open needs the steps in the README's Install section.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --bundles ${{ matrix.bundles }} --config tauri.release.conf.json

  # Gives the files plain names (the build's own names are technical) and points latest.json at them.
  rename:
    needs: [check, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      TAG: v${{ needs.check.outputs.version }}
      VER: ${{ needs.check.outputs.version }}
    steps:
      - name: Rename the files
        run: |
          set -euo pipefail
          rel="$(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.tag_name==\"$TAG\") | .id" | head -1)"
          [ -n "$rel" ] || { echo "No release for $TAG"; exit 1; }
          assets="$(gh api "repos/$REPO/releases/$rel/assets" --paginate)"
          pairs="
          Cadenza_${VER}_aarch64.dmg|Cadenza-${VER}-Mac-AppleSilicon.dmg
          Cadenza_${VER}_x64-setup.exe|Cadenza-${VER}-Windows-Setup.exe
          Cadenza_${VER}_x64-setup.exe.sig|Cadenza-${VER}-Windows-Setup.exe.sig
          Cadenza_${VER}_amd64.AppImage|Cadenza-${VER}-Linux.AppImage
          Cadenza_${VER}_amd64.AppImage.sig|Cadenza-${VER}-Linux.AppImage.sig
          Cadenza_aarch64.app.tar.gz|Cadenza-${VER}-Mac-AppleSilicon-Update.tar.gz
          Cadenza_aarch64.app.tar.gz.sig|Cadenza-${VER}-Mac-AppleSilicon-Update.tar.gz.sig"
          gh api -H "Accept: application/octet-stream" "repos/$REPO/releases/assets/$(echo "$assets" | jq -r '.[]|select(.name=="latest.json")|.id')" > latest.json
          for p in $pairs; do
            old="${p%%|*}"; new="${p##*|}"
            id="$(echo "$assets" | jq -r --arg n "$old" '.[]|select(.name==$n)|.id')"
            [ -n "$id" ] || { echo "Missing $old"; exit 1; }
            grep -q "$old" latest.json || [[ "$old" == *.sig || "$old" == *.dmg ]] || { echo "$old isn't in latest.json"; exit 1; }
            gh api -X PATCH "repos/$REPO/releases/assets/$id" -f name="$new" >/dev/null
            sed -i "s|/$old\"|/$new\"|g" latest.json
          done
          jq . latest.json >/dev/null
          old_id="$(echo "$assets" | jq -r '.[]|select(.name=="latest.json")|.id')"
          gh api -X DELETE "repos/$REPO/releases/assets/$old_id"
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" \
            --data-binary @latest.json "https://uploads.github.com/repos/$REPO/releases/$rel/assets?name=latest.json" >/dev/null
          cat latest.json
